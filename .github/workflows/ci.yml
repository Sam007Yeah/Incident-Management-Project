# CI Pipeline for running Tests and Building the project
name: Continuous Integration
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
    test:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
            DB_USER: testuser
            DB_PASSWORD: testpassword
            DB_HOST: localhost
            DB_PORT: 5432
            DB_NAME: testdb
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'
            - name: Install dependencies
              run: npm ci
            - name: Create env file
              run: |
                echo "DB_USER=$DB_USER" > .env
                echo "DB_PASSWORD=$DB_PASSWORD" >> .env
                echo "DB_HOST=$DB_HOST" >> .env
                echo "DB_PORT=$DB_PORT" >> .env
                echo "DB_NAME=$DB_NAME" >> .env
                echo "NODE_ENV=$NODE_ENV" >> .env
            - name: Coverage Report
              run: npm run test:coverage
    build:
        needs:  test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build
    build-image:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build Docker image
              run: docker build -t incident-management-api:${{ github.sha }} .
                
    