# CI Pipeline for running Tests and Building the project
name: Continuous Integration
on:
  push:
    branches: [ main ]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
            - name: Coverage Report
              run: npm run test:coverage
            - if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
              name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-report
    build:
        needs:  test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build
    build-image:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build Docker image
              run: docker build -t my-devops-app:${{ github.sha }} .
                
    